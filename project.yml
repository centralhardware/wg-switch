name: WGSwitch
options:
  bundleIdPrefix: me.centralhardware
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # optional; CI builds ad-hoc
targets:
  WGSwitch:
    type: application
    platform: macOS
    sources: [App, Shared]
    dependencies:
      - target: WGSwitchControls
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        CFBundleURLTypes:
          - CFBundleURLName: me.centralhardware.wgswitch
            CFBundleURLSchemes: [wgswitch]
    entitlements:
      path: App/WGSwitch.entitlements
      properties: {}
  WGSwitchControls:
    type: app-extension
    platform: macOS
    sources: [Controls, Shared]
    info:
      path: Controls/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Controls/WGSwitchControls.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # App groups need a provisioning profile, which an ad-hoc build doesn't have.
        # A shared preferences domain works with any signature.
        com.apple.security.temporary-exception.shared-preference.read-write: [me.centralhardware.wgswitch.shared]
