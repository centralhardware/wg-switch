name: Build & release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 (Control Center controls need the macOS 26 SDK)
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build
        run: |
          xcodebuild -project WGSwitch.xcodeproj -scheme WGSwitch \
            -configuration Release -derivedDataPath build \
            CODE_SIGN_IDENTITY=- build
      - name: Make DMG
        run: |
          mkdir dmg
          cp -R build/Build/Products/Release/WGSwitch.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "WGSwitch" -srcfolder dmg -ov -format UDZO WGSwitch.dmg
      - uses: actions/upload-artifact@v4
        with: { name: WGSwitch.dmg, path: WGSwitch.dmg }
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: WGSwitch.dmg }
