name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: |
          xcodebuild -project WGSwitch.xcodeproj -scheme WGSwitch -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - run: cd build/Build/Products/Release && zip -qr WGSwitch.zip WGSwitch.app
      - uses: actions/upload-artifact@v4
        with:
          name: WGSwitch
          path: build/Build/Products/Release/WGSwitch.zip
